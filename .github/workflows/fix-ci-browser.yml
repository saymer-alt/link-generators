name: Fix Generator CI browser setup

on:
  push:
    branches:
      - fix/v162-production-ux

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v162-production-ux
      - name: Patch CI and remove bootstrap files
        run: |
          set -euo pipefail
          python3 .github/fix-ci-browser.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/generator-ci.yml
          git rm .github/fix-ci-browser.py .github/workflows/fix-ci-browser.yml
          git commit -m "ci: use preinstalled Chrome for deterministic browser tests"
          git push origin HEAD:fix/v162-production-ux
