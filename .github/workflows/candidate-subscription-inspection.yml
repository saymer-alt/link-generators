  build-runtime:
    needs: patch-ui
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/subscription-inspection-hwid
      - uses: actions/checkout@v4
        with:
          repository: saymer-alt/web4core
          ref: feat/subscription-inspection-hwid
          path: _web4core
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: _web4core/package-lock.json
      - name: Build and validate source runtime
        shell: bash
        run: |
          set -euo pipefail
          cd _web4core
          npm ci --no-fund --no-audit
          node --test tools/tests/subscription-fetch-headers.test.mjs tools/tests/mihomo-exclude-filter.test.mjs tools/tests/mihomo-tun-stack.test.mjs
          npm run build:web:runtime
          node --check src/web4core.runtime.js
          cd ..
          node tests/runtime.cjs _web4core/src/web4core.runtime.js
          mkdir -p "$RUNNER_TEMP/runtime-artifact"
          cp _web4core/src/web4core.runtime.js "$RUNNER_TEMP/runtime-artifact/web4core.runtime.js"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-web4core-runtime
          path: ${{ runner.temp }}/runtime-artifact/web4core.runtime.js
          if-no-files-found: error
          retention-days: 1

  write-runtime:
    needs: build-runtime
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/subscription-inspection-hwid
      - uses: actions/download-artifact@v4
        with:
          name: candidate-web4core-runtime
          path: ${{ runner.temp }}/runtime-artifact
      - name: Commit tested runtime only
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/runtime-artifact/web4core.runtime.js" web4core.runtime.js
          if git diff --quiet -- web4core.runtime.js; then
            echo "Runtime already current"
            exit 0
          fi
          git config user.name "candidate-runtime"
          git config user.email "candidate-runtime@users.noreply.github.com"
          git add web4core.runtime.js
          git commit -m "chore: update tested web4core runtime for subscription inspection"
          git push origin HEAD:feat/subscription-inspection-hwid

  candidate-tests:
    needs: write-runtime
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/subscription-inspection-hwid
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install transient browser test dependencies
        shell: bash
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/generator-ci-deps"
          mkdir -p "$deps"
          npm install --prefix "$deps" --no-save --no-package-lock playwright@1.55.0 js-yaml@4.1.0
          echo "NODE_PATH=$deps/node_modules" >> "$GITHUB_ENV"
          echo "JS_YAML_PATH=$deps/node_modules/js-yaml/dist/js-yaml.min.js" >> "$GITHUB_ENV"
          echo "BROWSER_CHANNEL=chromium" >> "$GITHUB_ENV"
          "$deps/node_modules/.bin/playwright" install --with-deps chromium
      - name: Core consumer tests
        shell: bash
        run: |
          set -euo pipefail
          node --check web4core.runtime.js
          node tests/runtime.cjs web4core.runtime.js
          node tests/browser.cjs
          node tests/whitelist.cjs
          node tests/profile-matrix.cjs
          node tests/wg-dialer-selector.cjs
