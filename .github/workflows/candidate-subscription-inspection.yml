name: Candidate subscription inspection

on:
  push:
    branches:
      - feat/subscription-inspection-hwid

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/subscription-inspection-hwid
      - name: Apply targeted UI and docs patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

