name: Update web4core runtime

on:
  workflow_dispatch:
  push:
    branches:
      - main
  # Read-only validation of the build/test job on PRs. The write job below is
  # gated on github.ref == 'refs/heads/main', so it cannot run for a PR ref
  # (refs/pull/*/merge); the build job needs no secrets beyond the read-only
  # default token.
  pull_request:
    branches:
      - main
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: update-web4core-runtime
  cancel-in-progress: false

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Provenance: the SHA of the exact web4core checkout that was built and tested.
    outputs:
      source-sha: ${{ steps.source-revision.outputs.sha }}
    steps:
      - name: Checkout link-generators
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout web4core fork
        uses: actions/checkout@v4
        with:
          repository: saymer-alt/web4core
          ref: link-generators
          path: web4core-source
          persist-credentials: false

      - name: Record source revision
        id: source-revision
        working-directory: web4core-source
        run: |
          sha="$(git rev-parse HEAD)"
          echo "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and test fork runtime
        working-directory: web4core-source
        run: |
          npm ci
          # Worker bundle is a gitignored build artifact required by amnezia.test.mjs.
          npm run build:worker
          # Auto-discovery: every tools/tests/*.test.mjs runs here; adding a new
          # test file must not require workflow edits.
          node --test tools/tests/*.test.mjs
          npm run build:web:runtime
          test -s src/web4core.runtime.js

      - name: Check runtime
        run: |
          node --check web4core-source/src/web4core.runtime.js
          node tests/runtime.cjs web4core-source/src/web4core.runtime.js
          sha256sum web4core-source/src/web4core.runtime.js

      # Temporary read-only lab gate for branch awl-max-lab. Never runs on main.
      - name: Max AWL fixed blackhole restart lab
        if: github.event_name == 'pull_request' && github.head_ref == 'awl-max-lab'
        env:
          MIHOMO_URL: https://github.com/MetaCubeX/mihomo/releases/download/v1.19.31/mihomo-linux-amd64-v1.19.31.gz
          MIHOMO_SHA256: d5e74bbddbdfff49a1aef7775bf5911da59f0d7196ed509a0ac914b3653dd5f1
        run: |
          set -euo pipefail
          lab="$RUNNER_TEMP/awl-max-lab"
          mkdir -p "$lab/out" "$lab/js"
          curl -L --fail --retry 3 -o "$lab/mihomo.gz" "$MIHOMO_URL"
          echo "$MIHOMO_SHA256  $lab/mihomo.gz" | sha256sum -c -
          gzip -dc "$lab/mihomo.gz" > "$lab/mihomo"
          chmod +x "$lab/mihomo"
          "$lab/mihomo" -v
          npm --silent --prefix "$lab/js" install js-yaml@4.1.0
          MIHOMO_BIN="$lab/mihomo" \
          JS_YAML_PATH="$lab/js/node_modules/js-yaml" \
          TEST_RUNTIME_PATH="$GITHUB_WORKSPACE/web4core-source/src/web4core.runtime.js" \
          TEST_OUTPUT_DIR="$lab/out" \
          node tests/mihomo-awl-max-lab.manual.cjs

          echo "Running production-interval (300s) active-dial blackhole lab..."
          MIHOMO_BIN="$lab/mihomo" \
          JS_YAML_PATH="$lab/js/node_modules/js-yaml" \
          TEST_RUNTIME_PATH="$GITHUB_WORKSPACE/web4core-source/src/web4core.runtime.js" \
          TEST_OUTPUT_DIR="$lab/out-active" \
          AWL_LAB_INTERVAL=300 \
          AWL_PROD_ACTIVE_ONLY=1 \
          node tests/mihomo-awl-max-lab.manual.cjs

      - name: Upload Max AWL lab evidence
        if: github.event_name == 'pull_request' && github.head_ref == 'awl-max-lab' && always()
        uses: actions/upload-artifact@v4
        with:
          name: awl-max-lab-evidence
          path: ${{ runner.temp }}/awl-max-lab/out
          if-no-files-found: warn
          retention-days: 7

      - name: Upload checked runtime
        uses: actions/upload-artifact@v4
        with:
          name: web4core-runtime
          path: web4core-source/src/web4core.runtime.js
          if-no-files-found: error
          retention-days: 7

  update-runtime:
    needs: build-runtime
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      SOURCE_SHA: ${{ needs.build-runtime.outputs.source-sha }}
    steps:
      - name: Checkout tested link-generators revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download checked runtime
        uses: actions/download-artifact@v4
        with:
          name: web4core-runtime
          path: ${{ runner.temp }}/checked-runtime

      # Copy data only: never execute the artifact or external build code in this job.
      - name: Compare and update runtime
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main changed since validation; rerun against the new revision."
            exit 1
          fi
          runtime="$RUNNER_TEMP/checked-runtime/web4core.runtime.js"
          test -f "$runtime" && test -s "$runtime" && test ! -L "$runtime"
          if cmp -s "$runtime" web4core.runtime.js; then
            echo "Runtime is already up to date."
            exit 0
          fi
          cp "$runtime" web4core.runtime.js
          # Provenance: SOURCE_SHA comes from the build job and is the exact
          # web4core checkout the uploaded runtime was built and tested against.
          case "$SOURCE_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "SOURCE_SHA is not a 40-char hex SHA: $SOURCE_SHA"; exit 1 ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- web4core.runtime.js
          git commit -m "Update web4core runtime from upstream" \
            -m "Source: saymer-alt/web4core@$SOURCE_SHA" \
            -m "Source-Branch: link-generators"
          git push origin HEAD:main
