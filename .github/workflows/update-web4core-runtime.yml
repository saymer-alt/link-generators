name: Update web4core runtime

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - stable
  # Read-only validation runs for both integration (main) and production (stable).
  # The write job below remains gated on github.ref == 'refs/heads/main', so stable
  # can validate but never receives an automatic runtime write-back; PR refs also
  # (refs/pull/*/merge); the build job needs no secrets beyond the read-only
  # default token.
  pull_request:
    branches:
      - main
      - stable
      - fix/v1.11-release-polish-audit
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: update-web4core-runtime
  cancel-in-progress: false

jobs:
  build-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Provenance: the SHA of the exact web4core checkout that was built and tested.
    outputs:
      source-sha: ${{ steps.source-revision.outputs.sha }}
    steps:
      - name: Checkout link-generators
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout web4core fork
        uses: actions/checkout@v4
        with:
          repository: saymer-alt/web4core
          ref: link-generators
          path: web4core-source
          persist-credentials: false

      - name: Record source revision
        id: source-revision
        working-directory: web4core-source
        run: |
          sha="$(git rev-parse HEAD)"
          echo "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and test fork runtime
        working-directory: web4core-source
        run: |
          npm ci
          # Worker bundle is a gitignored build artifact required by amnezia.test.mjs.
          npm run build:worker
          # Web runtime is built BEFORE tests: subscription-endpoint.test.mjs
          # reads the built bundle to verify the production CORS endpoint.
          npm run build:web:runtime
          test -s src/web4core.runtime.js
          # Auto-discovery: every tools/tests/*.test.mjs runs here; adding a new
          # test file must not require workflow edits.
          node --test tools/tests/*.test.mjs

      - name: Check runtime
        run: |
          node --check web4core-source/src/web4core.runtime.js
          node tests/runtime.cjs web4core-source/src/web4core.runtime.js
          sha256sum web4core-source/src/web4core.runtime.js

      - name: Verify tracked runtime provenance
        id: tracked-runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          tracked = Path("web4core.runtime.js").read_bytes().replace(b"\r\n", b"\n")
          built = Path("web4core-source/src/web4core.runtime.js").read_bytes().replace(b"\r\n", b"\n")
          tracked_sha = hashlib.sha256(tracked).hexdigest()
          built_sha = hashlib.sha256(built).hexdigest()
          print(f"tracked-normalized-sha256={tracked_sha}")
          print(f"built-normalized-sha256={built_sha}")
          Path("/tmp/runtime-match").write_text("1" if tracked == built else "0")
          PY
          match="$(cat /tmp/runtime-match)"
          echo "match=$match" >> "$GITHUB_OUTPUT"
          if [ "$match" = 1 ]; then
            echo "Tracked runtime matches the freshly built runtime."
          else
            echo "::warning::Tracked web4core.runtime.js does not match the freshly built runtime."
          fi

      - name: Require published runtime match
        if: steps.tracked-runtime.outputs.match != '1' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/stable')
        run: |
          echo "Tracked web4core.runtime.js is not the runtime built and tested from the checked-out web4core source."
          echo "Regenerate/update the tracked runtime before this PR/stable revision can pass validation."
          echo "Стековый PR (runtime из candidate-ветки web4core): добавь ref в файл"
          echo ".github/web4core-source-ref — тогда job 'stacked runtime provenance' провалидирует"
          echo "blob против объявленного источника. Перед merge в main этот файл удаляется,"
          echo "а настоящий (production) provenance обязан стать зелёным — см. документацию."
          exit 1

      - name: Upload checked runtime
        uses: actions/upload-artifact@v4
        with:
          name: web4core-runtime
          path: web4core-source/src/web4core.runtime.js
          if-no-files-found: error
          retention-days: 7

  # Стековый PR: runtime собран из candidate-ветки web4core, которая ещё не
  # смержена в link-generators. Обязательный production-проверка выше остаётся
  # красной до merge зависимости (задокументированное исключение). Этот job —
  # дополнительная СТРОГАЯ проверка против явно объявленного источника:
  # если .github/web4core-source-ref существует, blob обязан байт-в-байт
  # совпадать со сборкой этого ref, иначе job красный. Файл удаляется при
  # merge зависимости; production-проверка от него не зависит и не ослабляется.
  stacked-runtime-provenance:
    name: stacked runtime provenance (declared candidate source)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout link-generators
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read declared candidate source ref
        id: declared-ref
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .github/web4core-source-ref ]; then
            echo "Файл .github/web4core-source-ref отсутствует — стековая проверка не объявлена."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ref="$(tr -d ' \t\r\n' < .github/web4core-source-ref)"
          case "$ref" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;; # full/short sha
            [A-Za-z0-9._/-]*) ;;                                                    # branch name
            *) echo "Некорректный ref: '$ref'"; exit 1 ;;
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Dependency merged — remove the stale ref file
        if: steps.declared-ref.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          published="$(git ls-remote https://github.com/saymer-alt/web4core.git refs/heads/link-generators | cut -f1)"
          declared="${{ steps.declared-ref.outputs.ref }}"
          if [ "$published" = "$declared" ]; then
            echo "Зависимость уже смержена (link-generators tip == объявленному ref)."
            echo "Удали .github/web4core-source-ref — production-проверка выше теперь зелёная."
            exit 1
          fi
          echo "Объявленный source '$declared' ещё не опубликован в link-generators ($published) — стековая валидация уместна."

      - name: Checkout declared web4core source
        if: steps.declared-ref.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          repository: saymer-alt/web4core
          ref: ${{ steps.declared-ref.outputs.ref }}
          path: web4core-source
          persist-credentials: false

      - name: Setup Node.js
        if: steps.declared-ref.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and test declared source
        if: steps.declared-ref.outputs.skip == 'false'
        working-directory: web4core-source
        run: |
          set -euo pipefail
          npm ci --no-fund --no-audit
          npm run build:worker
          npm run build:web:runtime
          node --test tools/tests/*.test.mjs
          test -s src/web4core.runtime.js

      - name: Verify tracked runtime against declared source
        if: steps.declared-ref.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          node --check web4core-source/src/web4core.runtime.js
          node tests/runtime.cjs web4core-source/src/web4core.runtime.js
          python - <<'PY'
          from pathlib import Path
          import hashlib
          tracked = Path("web4core.runtime.js").read_bytes().replace(b"\r\n", b"\n")
          built = Path("web4core-source/src/web4core.runtime.js").read_bytes().replace(b"\r\n", b"\n")
          print(f"tracked-normalized-sha256={hashlib.sha256(tracked).hexdigest()}")
          print(f"declared-built-normalized-sha256={hashlib.sha256(built).hexdigest()}")
          if tracked != built:
              raise SystemExit("Tracked runtime does NOT match the declared candidate source build.")
          print("Tracked runtime matches the declared candidate source build.")
          PY

  update-runtime:
    needs: build-runtime
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      SOURCE_SHA: ${{ needs.build-runtime.outputs.source-sha }}
    steps:
      - name: Checkout tested link-generators revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download checked runtime
        uses: actions/download-artifact@v4
        with:
          name: web4core-runtime
          path: ${{ runner.temp }}/checked-runtime

      # Copy data only: never execute the artifact or external build code in this job.
      - name: Compare and update runtime
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main changed since validation; rerun against the new revision."
            exit 1
          fi
          runtime="$RUNNER_TEMP/checked-runtime/web4core.runtime.js"
          test -f "$runtime" && test -s "$runtime" && test ! -L "$runtime"
          if cmp -s "$runtime" web4core.runtime.js; then
            echo "Runtime is already up to date."
            exit 0
          fi
          cp "$runtime" web4core.runtime.js
          # Provenance: SOURCE_SHA comes from the build job and is the exact
          # web4core checkout the uploaded runtime was built and tested against.
          case "$SOURCE_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "SOURCE_SHA is not a 40-char hex SHA: $SOURCE_SHA"; exit 1 ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- web4core.runtime.js
          git commit -m "Update web4core runtime from upstream" \
            -m "Source: saymer-alt/web4core@$SOURCE_SHA" \
            -m "Source-Branch: link-generators"
          git push origin HEAD:main
