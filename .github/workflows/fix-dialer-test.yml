name: Fix v1.6.2 dialer regression test

on:
  push:
    branches:
      - fix/v162-production-ux

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v162-production-ux
      - name: Patch regression and remove bootstrap files
        run: |
          set -euo pipefail
          python3 .github/fix-dialer-test.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/wg-dialer-selector.cjs
          git rm .github/fix-dialer-test.py .github/workflows/fix-dialer-test.yml
          git commit -m "test: keep legacy dialer group active during regression"
          git push origin HEAD:fix/v162-production-ux
