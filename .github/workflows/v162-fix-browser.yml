name: v1.6.2 browser adjustment

on:
  push:
    branches:
      - fix/v162-production-ux

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v162-production-ux
          fetch-depth: 0
          persist-credentials: true
      - name: Patch legacy browser regression
        run: |
          set -euo pipefail
          python3 .github/v162_fix_browser.py
          git diff --check
      - name: Commit and remove temporary files
        run: |
          set -euo pipefail
          git rm .github/workflows/v162-fix-browser.yml .github/v162_fix_browser.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/browser.cjs
          git diff --cached --check
          git commit -m 'test: adapt browser regression to dialer ADVANCED'
          git push origin HEAD:fix/v162-production-ux
