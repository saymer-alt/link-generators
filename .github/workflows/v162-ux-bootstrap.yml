name: v1.6.2 UX bootstrap

on:
  push:
    branches:
      - fix/v162-production-ux

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v162-production-ux
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply targeted UX patch
        run: |
          set -euo pipefail
          python3 .github/v162_patch.py
          git diff --check
          node --check web4core.runtime.js
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if 'id' in d:
                      self.ids.append(d['id'])
          q=P()
          q.feed(Path('index.html').read_text(encoding='utf-8'))
          dup=sorted({x for x in q.ids if q.ids.count(x)>1})
          assert not dup, dup
          print('bootstrap static checks: PASS')
          PY

      - name: Commit patch and remove temporary bootstrap files
        run: |
          set -euo pipefail
          git rm .github/workflows/v162-ux-bootstrap.yml .github/v162_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/wg-dialer-selector.cjs tests/help-ux-browser.cjs
          git diff --cached --check
          git commit -m 'fix: polish v1.6.2 production UX'
          git push origin HEAD:fix/v162-production-ux
