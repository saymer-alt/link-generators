          provider_patch = r'''
function applyProviderDialerTargets(yaml) {
  const wanted = wgProfiles.map((p, index) => ({ p, index, provider: dialerProviderName(p.target) }))
    .filter(x => x.p.mode === 'proxy' && x.provider);
  if (!wanted.length) return yaml; // byte parity: обычные цели не затрагиваются
  const doc = jsyaml.load(String(yaml));
  if (!doc || typeof doc !== 'object' || Array.isArray(doc)) throw new Error('Не удалось применить subscription dialer-target: YAML не является объектом');
  const providers = doc['proxy-providers'];
  if (!providers || typeof providers !== 'object' || Array.isArray(providers)) throw new Error('Subscription dialer-target требует proxy-providers');
  const proxies = Array.isArray(doc.proxies) ? doc.proxies : [];
  const groups = Array.isArray(doc['proxy-groups']) ? doc['proxy-groups'] : [];
  const wireguards = proxies.filter(p => p && p.type === 'wireguard');
  const usedNames = new Set([
    ...proxies.map(p => p && p.name).filter(Boolean),
    ...groups.map(g => g && g.name).filter(Boolean),
  ]);
  const groupByProvider = new Map();
  const ensureGroup = (provider) => {
    if (groupByProvider.has(provider)) return groupByProvider.get(provider);
    if (!Object.prototype.hasOwnProperty.call(providers, provider)) throw new Error('Подписка «' + provider + '» отсутствует в proxy-providers');
    let base = 'DIALER-' + provider;
    let name = base, n = 2;
    while (usedNames.has(name)) name = base + '-' + n++;
    usedNames.add(name);
    groups.push({ name, type: 'select', use: [provider] });
    groupByProvider.set(provider, name);
    return name;
  };
  for (const { index, provider } of wanted) {
    const outbound = wireguards[index];
    if (!outbound) throw new Error('Не найден WireGuard outbound для subscription dialer-target #' + (index + 1));
    outbound['dialer-proxy'] = ensureGroup(provider);
  }
  doc['proxy-groups'] = groups;
  return jsyaml.dump(doc, { lineWidth: -1 });
}
'''
